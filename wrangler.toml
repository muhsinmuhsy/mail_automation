name = "mail-automation"
main = "worker/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_APP_URL = "http://localhost:3000"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "resume-bucket"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-queue"

[[queues.consumers]]
queue = "email-queue"
max_batch_size = 10

[triggers]
crons = ["* * * * *"]
