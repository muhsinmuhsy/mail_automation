name = "mail-automation"
main = "worker/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_APP_URL = "http://localhost:3000"

# Backblaze B2 (S3-Compatible API) is configured via Worker secrets/env,
# NOT a Cloudflare R2 binding. Set these with `wrangler secret put`:
#   B2_BUCKET_NAME, B2_REGION, B2_ENDPOINT, B2_KEY_ID, B2_APPLICATION_KEY

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-queue"

[[queues.consumers]]
queue = "email-queue"
max_batch_size = 10

[[unsafe.bindings]]
type = "ratelimit"
name = "RATE_LIMITER_AUTH"

[[unsafe.bindings]]
type = "ratelimit"
name = "RATE_LIMITER_API"

[triggers]
crons = ["* * * * *"]
